<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no">
<title>Arène Survivor</title>
<style>
  html, body { margin: 0; height: 100%; background: #47aba9; overflow: hidden; }
  #c { width: 100vw; height: 100vh; display: block; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
          font: bold 22px system-ui, sans-serif; color: #fff4e0; text-shadow: 0 2px 0 #33241a; gap: 14px; }
  #bar { width: min(320px, 80vw); height: 16px; border: 3px solid #33241a; border-radius: 8px; background: #2a1d18; overflow: hidden; }
  #fill { height: 100%; width: 0; background: #ffd84a; }
  #heroes { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; width: 100%; max-width: 760px; padding: 0 16px; box-sizing: border-box; }
  .hero { display: flex; flex-direction: column; align-items: center; font-size: 13px; }
  .hero span { width: 90px; height: 116px; overflow: hidden; }   /* cadre ; réduit sur téléphone */
  .hero i { display: block; width: 90px; height: 116px; background: url(heroes.png) no-repeat; image-rendering: pixelated;
            transform-origin: 0 0; animation: idle 0.9s steps(6) infinite; }
  @keyframes idle { from { background-position-x: 0; } to { background-position-x: -540px; } }
  #keys { font-size: 15px; line-height: 1.6; text-align: center; padding: 0 16px; width: 100%; max-width: 760px; box-sizing: border-box; }
  #keys .k { white-space: nowrap; }
  #keys b { display: inline-block; margin: 2px 1px; min-width: 1.4em; padding: 0 6px; border: 2px solid #33241a; border-radius: 6px;
            background: #fff4e0; color: #33241a; text-shadow: none; font-size: 13px; }
  @media (max-width: 560px) { .hero span { width: 54px; height: 69px; } .hero i { transform: scale(0.6); }
    .hero { font-size: 11px; } #load { font-size: 19px; } #keys { font-size: 13px; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load">
  <div>Arène Survivor</div>
  <div id="heroes">
    <div class="hero"><span><i style="background-position-y:0"></i></span>Guerrier</div>
    <div class="hero"><span><i style="background-position-y:-116px"></i></span>Archère</div>
    <div class="hero"><span><i style="background-position-y:-232px"></i></span>Lancier</div>
    <div class="hero"><span><i style="background-position-y:-348px"></i></span>Moine</div>
    <div class="hero"><span><i style="background-position-y:-464px"></i></span>Berserker</div>
    <div class="hero"><span><i style="background-position-y:-580px"></i></span>Roi</div>
    <div class="hero"><span><i style="background-position-y:-696px"></i></span>Mage</div>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="keys">
    Bouger : <span class="k"><b>Z</b> <b>Q</b> <b>S</b> <b>D</b></span> ou <span class="k"><b>W</b> <b>A</b> <b>S</b> <b>D</b></span> ou les flèches, ou glisse avec la souris<br>
    Ton héros attaque tout seul · <b>E</b> lance le pouvoir quand il est chargé
  </div>
</div>
<script src="Build/2817f922314aacd6d3389f1e41bc27c8.loader.js"></script>
<script>
  createUnityInstance(document.querySelector("#c"), {
    dataUrl: "Build/d55c55ff9c6088481080e8775a671309.data", frameworkUrl: "Build/91872489677d209bbfd6fdecfdc94f93.framework.js", codeUrl: "Build/d92044df3aa153daec5b03c0d30b5415.wasm",
    companyName: "charlit", productName: "Arene", productVersion: "0.1",
  }, p => document.querySelector("#fill").style.width = (p * 100) + "%")
  .then(() => document.querySelector("#load").remove())
  .catch(e => document.querySelector("#load").textContent = e);
</script>
</body>
</html>
